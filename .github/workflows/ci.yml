name: CI Workflow

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Validar compilacion o scripts
        run: |
          if [ -f package.json ]; then npm run build --if-present; else echo "Entorno inicial sin package.json listo"; fi